[project]
name = "facturitas"
version = "0.1.0"
description = "Facturación electrónica ARCA fácil, local y abierta"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
    "cryptography>=43",
    "httpx>=0.27",
    "platformdirs>=4",
    "typer>=0.12",
]

[project.scripts]
facturitas = "facturitas.cli.app:main"

[dependency-groups]
dev = [
    "mypy>=1.10",
    "pytest>=8",
    "respx>=0.21",
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/facturitas"]

[tool.ruff]
line-length = 100
extend-exclude = ["tools", "referencia_privada"]
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not homo'"
markers = ["homo: integración contra homologación de ARCA (requiere credencial configurada)"]
