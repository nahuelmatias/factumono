{% extends "base.html" %}
{% block titulo %}Facturitas · Mis facturas{% endblock %}
{% block contenido %}
<h1>Mis facturas</h1>
<form class="tarjeta" hx-get="/facturas" hx-target="#tabla" hx-trigger="input changed delay:300ms from:#q, submit">
  <label for="q">Buscar (cliente, CUIT, número o CAE)</label>
  <input id="q" name="q" value="{{ q }}" type="search" autocomplete="off">
</form>
<section class="tarjeta" id="tabla">
  {% include "_tabla_facturas.html" %}
</section>
<p class="suave">Con «PDF» ves la factura; desde ahí también la imprimís o la guardás. Para mandarla por mail, abrí la carpeta y adjuntala.</p>
{% endblock %}
